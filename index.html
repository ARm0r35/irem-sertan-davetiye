<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>İrem & Sertan | Dijital Davetiye</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- LOADER -->

<div id="loader">

<div class="loaderLogo">

İ & S

</div>

</div>

<!-- KAPAK -->

<header class="hero">

<div class="overlay"></div>

<div class="heroContent">

<div class="logo">

İ & S

</div>

<h1>

İrem & Sertan

</h1>

<p>

23 Ağustos 2026

</p>

<button id="openInvitation">

Davetiyeyi Aç

</button>

</div>

</header>

<!-- ZARF -->

<section id="envelopeSection">

<div class="envelope">

<div class="back"></div>

<div class="left"></div>

<div class="right"></div>

<div class="top"></div>

<div class="letter">

<img src="images/davetiye.jpg" alt="Davetiye">

</div>

</div>

</section>

<!-- GERİ SAYIM -->

<section id="countdown">

<h2>Düğünümüze Kalan Süre</h2>

<div class="counter">

<div class="card">

<span id="days">00</span>

<small>Gün</small>

</div>

<div class="card">

<span id="hours">00</span>

<small>Saat</small>

</div>

<div class="card">

<span id="minutes">00</span>

<small>Dakika</small>

</div>

<div class="card">

<span id="seconds">00</span>

<small>Saniye</small>

</div>

</div>

</section>

<!-- GALERİ -->

<section id="gallery">

<h2>Anılarımız</h2>

<div class="photos">

<img src="images/kapak.jpg">

<img src="images/yuzuk.png">

</div>

</section>

<!-- KONUM -->

<section id="location">

<h2>Düğün Konumu</h2>

<p>

Viva Garden Wedding Kır Düğün Salonları

<br>

Buca / İzmir

</p>

<a class="mapButton"

target="_blank"

href="https://www.google.com/maps/search/?api=1&query=Viva+Garden+Wedding+Buca">

📍 Yol Tarifi Al

</a>

</section>

<!-- TEŞEKKÜR -->

<section id="thanks">

<h2>

Teşekkür Ederiz

</h2>

<p>

Bu mutlu günümüzde sizleri aramızda görmekten mutluluk duyacağız.

</p>

<h3>

İrem ❤️ Sertan

</h3>

</section>

<script src="js/script.js"></script>

</body>

</html>
